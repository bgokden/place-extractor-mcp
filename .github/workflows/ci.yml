name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Smoke tests exercise the MCP wiring (server, tools, output shape) and do
      # NOT download the model, so we install only the lightweight deps here.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip "mcp>=1.2.0,<2" pytest

      - name: Run smoke tests
        run: pytest -q
        env:
          PYTHONPATH: src
